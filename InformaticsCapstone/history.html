<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History | TripCast</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --deep: #0d2b36; --sea: #1f6f8b; --sun: #f2b53a; --mist: #eaf3f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: "Outfit", system-ui, sans-serif; color: var(--deep); background: var(--mist); }
    .card { width: 100%; max-width: 480px; padding: 36px 32px; text-align: center; background: #fff; border-radius: 22px; border-top: 6px solid var(--sun); box-shadow: 0 24px 60px -20px rgba(13,43,54,.45); }
    h1 { margin: 0 0 8px; font-family: "Fraunces", Georgia, serif; font-size: 1.9rem; }
    p { margin: 8px 0; }
    .btn { display: inline-block; margin-top: 16px; padding: 10px 22px; border-radius: 999px; background: var(--sea); color: #fff; text-decoration: none; font-weight: 500; }
    .btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <!-- Shown while we check whether the user is logged in -->
  <div class="card" id="checking" role="status">Checking your account…</div>

  <!-- Error screen for logged-out users -->
  <div class="card" id="denied" role="alert" hidden>
    <h1>Please log in first</h1>
    <p>You need to be logged in to view your history.</p>
    <p>Taking you back to the dashboard in <strong id="count">5</strong> seconds…</p>
    <a class="btn" href="dashboard.html">Go to dashboard now</a>
  </div>

  <!-- Real history page, shown only to logged-in users -->
  <div class="card" id="history" hidden>
    <h1>Your history</h1>
    <p id="who"></p>
    <p>Your past trips will appear here.</p>
    <a class="btn" href="dashboard.html">Back to dashboard</a>
  </div>

  <script>
    const show = (id) => {
      ['checking', 'denied', 'history'].forEach((x) => (document.getElementById(x).hidden = x !== id));
    };

    function redirectToDashboard() {
      show('denied');
      let n = 5;
      const timer = setInterval(() => {
        n -= 1;
        document.getElementById('count').textContent = n;
        if (n <= 0) { clearInterval(timer); location.replace('dashboard.html'); }
      }, 1000);
    }

    (async () => {
      try {
        // Asks the server who is logged in. 401 means nobody.
        const r = await fetch('api/users.php?action=me', { credentials: 'same-origin' });
        if (!r.ok) throw new Error('not logged in');
        const user = await r.json();
        document.getElementById('who').textContent = 'Signed in as ' + user.firstName + ' ' + user.lastName;
        show('history');
      } catch {
        redirectToDashboard();
      }
    })();
  </script>
</body>
</html>
