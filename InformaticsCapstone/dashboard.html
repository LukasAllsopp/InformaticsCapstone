<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Tell the browser which character set and language this page uses. -->
  <meta charset="utf-8">
  <!-- Make the layout adapt to phones and tablets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripCast Dashboard</title>
  <!-- Establish early connections before loading the Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Reusable colors and font choices for the entire dashboard. */
    :root {
      --deep: #0d2b36; --sea: #1f6f8b; --sky: #8fd0e0; --sun: #f2b53a; --mist: #eaf3f2; --ink: #0d2b36;
      --display: "Fraunces", Georgia, serif; --body: "Outfit", system-ui, sans-serif;
    }
    /* Include padding and borders inside an element's declared size. */
    * { box-sizing: border-box; }
    /* Make the application fill the browser window. */
    html, body { height: 100%; margin: 0; }
    /* The page background and the outer spacing around the dashboard card. */
    body {
      font-family: var(--body); color: var(--ink); padding: 28px; min-height: 100%; overflow: hidden;
      background: radial-gradient(circle at 15% 10%, #cfe9ee 0, transparent 45%), radial-gradient(circle at 90% 90%, #f6e7c3 0, transparent 40%), var(--mist);
    }
    /* The main white dashboard container. */
    .frame {
      height: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
      border-radius: 22px; background: #fff; box-shadow: 0 24px 60px -20px rgba(13,43,54,.45), 0 0 0 1px rgba(13,43,54,.08);
    }
    /* The top navigation bar. */
    header {
      position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 22px 28px;
      color: #fff; background: linear-gradient(120deg, var(--deep) 0%, var(--sea) 70%, #3a9bb5 100%);
      border-bottom: 4px solid var(--sun);
    }
    /* Decorative contour-line pattern behind the header contents. */
    header::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .12;
      background: repeating-radial-gradient(circle at 50% 15vmin, transparent 0 18px, #fff 18px 19px);
    }
    header > * { position: relative; }
    /* Center the TripCast logo and title. */
    .brand { display: flex; align-items: center; gap: 12px; justify-self: center; }
    .brand svg { width: 38px; height: 38px; flex: none; }
    .brand h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 3.4vw, 2.3rem); letter-spacing: .01em; }
    .left { justify-self: start; }
    .right { justify-self: end; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    /* Shared style for the navigation buttons. */
    .pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 999px; text-decoration: none;
      font-weight: 500; color: #fff; border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.12);
      backdrop-filter: blur(6px); transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .pill:hover { transform: translateY(-2px); background: rgba(255,255,255,.25); box-shadow: 0 8px 18px -8px rgba(0,0,0,.5); }
    .pill.primary { background: var(--sun); border-color: var(--sun); color: var(--deep); font-weight: 600; }
    .pill.primary:hover { background: #ffc857; }
    .pill:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    /* Three columns: locations, map, and weather. */
    .dashboard-content { display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; flex: 1; min-height: 0; }
    .panel { min-width: 0; padding: 20px; background: #f7fbfa; }
    .markers-panel { display: flex; flex-direction: column; overflow: hidden; }
    .panel h2 { margin: 0 0 6px; color: var(--deep); font-family: var(--display); font-size: 1.35rem; }
    .panel-intro { margin: 0 0 16px; color: #567078; font-size: .9rem; }
    /* The location list scrolls independently when it gets long. */
    .marker-list { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 4px; }
    .marker-card { padding: 12px; border: 1px solid #cfe1e2; border-radius: 10px; background: #fff; box-shadow: 0 3px 10px rgba(13,43,54,.07); }
    .marker-card:focus-within { border-color: var(--sea); box-shadow: 0 0 0 2px rgba(31,111,139,.15); }
    .marker-name { display: block; margin-bottom: 4px; font-weight: 600; }
    .marker-order { display: inline-block; margin-right: 5px; color: var(--sea); }
    .marker-coordinates { display: block; margin-bottom: 10px; color: #567078; font-size: .78rem; }
    .marker-actions { display: flex; gap: 7px; }
    .marker-actions button { padding: 5px 9px; border: 1px solid #b7ced1; border-radius: 6px; color: var(--deep); background: #fff; cursor: pointer; font: inherit; font-size: .8rem; }
    .marker-actions button:hover { background: #eaf3f2; }
    .marker-actions .remove-button { color: #9b3434; border-color: #dfbaba; }
    .marker-edit { width: 100%; margin-bottom: 8px; padding: 6px 7px; border: 1px solid var(--sea); border-radius: 5px; font: inherit; }
    .order-edit { width: 5em; }
    .empty-state { color: #567078; font-size: .9rem; line-height: 1.45; }
    .weather-panel { border-left: 1px solid #dceaea; }
    /* Weather cards also get their own scroll area. */
    .weather-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .weather-card { padding: 12px; border: 1px solid #cfe1e2; border-radius: 10px; background: #fff; box-shadow: 0 3px 10px rgba(13,43,54,.07); }
    .weather-card h3 { margin: 0 0 8px; color: var(--deep); font-size: 1rem; }
    .weather-card p { margin: 4px 0; color: #567078; font-size: .85rem; }
    .weather-temperature { color: var(--sea) !important; font-size: 1.5rem !important; font-weight: 600; }
    .weather-placeholder { min-height: 160px; padding: 16px; border: 1px dashed #a9c8cc; border-radius: 12px; color: #567078; background: #fff; line-height: 1.45; }
    .map-wrap { position: relative; min-width: 0; min-height: 300px; }
    #map { height: 100%; min-height: 300px; color: #4d6a70; background: var(--mist); }
    #coordinates {
      position: absolute; left: 18px; bottom: 18px; margin: 0; padding: 10px 14px; border-radius: 10px;
      color: var(--deep); background: rgba(255, 255, 255, .92); box-shadow: 0 4px 14px rgba(13,43,54,.2);
    }
    /* "Use my location" button above the location list. */
    .locate-btn { padding: 8px 12px; border: 1px solid var(--sea); border-radius: 8px; color: var(--sea); background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .locate-btn:hover { background: #eaf3f2; }
    .locate-btn:disabled { opacity: .6; cursor: default; }
    .locate-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
    .locate-msg { margin: 6px 0 12px; min-height: 1.2em; color: #567078; font-size: .85rem; }
    .locate-msg.error { color: #9b3434; }
    /* Save-trip box under the location list. */
    .save-box { display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #dceaea; }
    .save-box input { padding: 8px; border: 1px solid #b7ced1; border-radius: 6px; font: inherit; }
    .save-box button { padding: 9px 12px; border: 0; border-radius: 8px; color: #fff; background: var(--sea); font: inherit; font-weight: 600; cursor: pointer; }
    .save-box button:disabled { opacity: .6; cursor: default; }
    .save-box button:focus-visible, .save-box input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
    #save-msg { margin: 0; min-height: 1.2em; color: #567078; font-size: .85rem; }
    #save-msg.error { color: #9b3434; }
    /* Logged-in header: greeting and Log out button. */
    button.pill { font: inherit; font-weight: 600; cursor: pointer; }
    .hello { align-self: center; font-weight: 500; }
    #account { visibility: hidden; } /* hidden until we know if someone is logged in */

    @media (prefers-reduced-motion: reduce) { .pill { transition: none; } .pill:hover { transform: none; } }
    /* On narrow screens, stack the three dashboard sections vertically. */
    @media (max-width: 760px) {
      body { padding: 8px; }
      .frame { border-radius: 14px; }
      header { grid-template-columns: 1fr; justify-items: center; padding: 16px; }
      .left, .right { justify-self: center; justify-content: center; }
      .brand { order: -1; }
      .dashboard-content { grid-template-columns: 1fr; overflow-y: auto; }
      .panel { border: 0; }
      .map-wrap { min-height: 420px; }
      .weather-panel { order: 3; }
    }
  </style>
</head>
<body>
  <!-- Everything inside this frame is the visible TripCast application. -->
  <div class="frame">
    <!-- Header navigation and branding. -->
    <header>
      <nav class="left" aria-label="History">
        <a class="pill" href="history.html">History</a>
      </nav>
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="17" stroke="#fff" stroke-width="2"/><path d="M20 7l4.5 13L20 33l-4.5-13z" fill="#f2b53a"/><circle cx="20" cy="20" r="2.2" fill="#0d2b36"/></svg>
        <h1>TripCast</h1>
      </div>
      <nav class="right" id="account" aria-label="Account">
        <a class="pill" href="userLogin.html">Login</a>
        <a class="pill primary" href="signup.html">Create Account</a>
      </nav>
    </header>
    <!-- Main dashboard area containing the three panels. -->
    <div class="dashboard-content">
      <!-- Left panel: the saved map locations. -->
      <aside class="panel markers-panel" aria-labelledby="markers-heading">
        <h2 id="markers-heading">My locations</h2>
        <p class="panel-intro">Click the map to add a pin. Drag pins to move them.</p>
        <button id="use-location" class="locate-btn" type="button">Use my location</button>
        <p id="locate-msg" class="locate-msg" role="status"></p>
        <div id="marker-list" class="marker-list">
          <p class="empty-state">No locations yet. Add one by clicking anywhere on the map.</p>
        </div>
        <div class="save-box">
          <input id="trip-name" type="text" maxlength="100" placeholder="Trip name (e.g. Shore weekend)" aria-label="Trip name">
          <button id="save-trip" type="button">Save trip</button>
          <p id="save-msg" role="status"></p>
        </div>
      </aside>
      <!-- Center panel: Google Maps renders inside this div. -->
      <main class="map-wrap">
        <div id="map" role="application" aria-label="Map">Loading map…</div>
        <p id="coordinates" hidden>
          Latitude: <span id="latitude"></span>,
          Longitude: <span id="longitude"></span>
        </p>
      </main>
      <!-- Right panel: current weather cards are inserted by JavaScript. -->
      <aside class="panel weather-panel" aria-labelledby="weather-heading">
        <h2 id="weather-heading">Weather</h2>
        <p class="panel-intro">Weather details</p>
        <div id="weather-list" class="weather-list">
          <div class="weather-placeholder">Add a location to see its weather.</div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Load the Google Maps API key without putting it directly in this file. -->
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    // The Google Maps instance.
    let map;
    // Used to give each newly created marker a unique ID and default name.
    let markerNumber = 0;
    // Stores marker data by ID so it can be found later for editing/removal.
    const markers = new Map();
    // The local Python endpoint that returns weather for coordinates.
    const WEATHER_API_URL = 'http://127.0.0.1:5000/api/weather';

    // Show the coordinates of the most recently selected or dragged marker.
    function updateCoordinates(position) {
      document.getElementById('latitude').textContent = position.lat().toFixed(6);
      document.getElementById('longitude').textContent = position.lng().toFixed(6);
      document.getElementById('coordinates').hidden = false;
    }

    // Rebuild the left-side list from the current contents of the markers Map.
    function renderMarkers() {
      const list = document.getElementById('marker-list');
      // Remove the old cards before drawing the current list.
      list.replaceChildren();
      if (!markers.size) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent = 'No locations. Click the map to add one.';
        list.appendChild(empty);
        return;
      }

      // Sort by vacation order before displaying the cards.
      [...markers.values()]
        .sort((a, b) => a.order - b.order)
        .forEach((markerData) => {
        // Create one card for this marker.
        const card = document.createElement('article');
        card.className = 'marker-card';
        card.dataset.markerId = markerData.id;

        // Display the order number and marker name.
        const name = document.createElement('span');
        name.className = 'marker-name';
        const order = document.createElement('span');
        order.className = 'marker-order';
        order.textContent = `${markerData.order}.`;
        name.appendChild(order);
        name.appendChild(document.createTextNode(markerData.name));
        card.appendChild(name);

        // Display the marker's current map position.
        const coordinates = document.createElement('span');
        coordinates.className = 'marker-coordinates';
        coordinates.textContent = formatCoordinates(markerData.marker.getPosition());
        card.appendChild(coordinates);

        // Add Edit and Remove controls to the card.
        const actions = document.createElement('div');
        actions.className = 'marker-actions';
        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.textContent = 'Edit';
        editButton.addEventListener('click', () => editMarker(markerData.id, card));
        actions.appendChild(editButton);

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'remove-button';
        removeButton.textContent = 'Remove';
        removeButton.addEventListener('click', () => removeMarker(markerData.id));
        actions.appendChild(removeButton);
        card.appendChild(actions);
        list.appendChild(card);
        });
    }

    // Convert a Google Maps LatLng object into readable text.
    function formatCoordinates(position) {
      return `${position.lat().toFixed(6)}, ${position.lng().toFixed(6)}`;
    }

    // Replace a marker card with editable name and order fields.
    function editMarker(id, card) {
      const markerData = markers.get(id);
      if (!markerData) return;
      // Center the map on the marker being edited.
      map.panTo(markerData.marker.getPosition());
      updateCoordinates(markerData.marker.getPosition());

      // Create the editable marker-name input.
      const name = card.querySelector('.marker-name');
      const input = document.createElement('input');
      input.className = 'marker-edit';
      input.type = 'text';
      input.value = markerData.name;
      input.maxLength = 60;
      input.setAttribute('aria-label', `Name for ${markerData.name}`);
      name.replaceWith(input);
      input.focus();
      input.select();

      // Create the editable vacation-order input.
      const orderInput = document.createElement('input');
      orderInput.className = 'marker-edit order-edit';
      orderInput.type = 'number';
      orderInput.min = '1';
      orderInput.max = String(markers.size);
      orderInput.value = String(markerData.order);
      orderInput.setAttribute('aria-label', `Order for ${markerData.name}`);
      card.insertBefore(orderInput, card.querySelector('.marker-coordinates'));

      // Save applies the edited name and requested order.
      const actions = card.querySelector('.marker-actions');
      actions.replaceChildren();
      const saveButton = document.createElement('button');
      saveButton.type = 'button';
      saveButton.textContent = 'Save';
      saveButton.addEventListener('click', () => {
        markerData.name = input.value.trim() || markerData.name;
        const requestedOrder = Number.parseInt(orderInput.value, 10);
        if (Number.isInteger(requestedOrder) && requestedOrder >= 1 && requestedOrder <= markers.size) {
          reorderMarkers(markerData.id, requestedOrder);
        }
        markerData.marker.setTitle(markerData.name);
        renderMarkers();
        refreshWeather();
      });
      actions.appendChild(saveButton);

      const cancelButton = document.createElement('button');
      cancelButton.type = 'button';
      cancelButton.textContent = 'Cancel';
      cancelButton.addEventListener('click', renderMarkers);
      actions.appendChild(cancelButton);
    }

    // Remove a marker from both the map and the saved marker list.
    function removeMarker(id) {
      const markerData = markers.get(id);
      if (!markerData) return;
      markerData.marker.setMap(null);
      markers.delete(id);
      // Close the numbering gap left by the removed marker.
      [...markers.values()]
        .sort((a, b) => a.order - b.order)
        .forEach((item, index) => { item.order = index + 1; });
      renderMarkers();
      refreshWeather();
    }

    // Move one marker to a requested order and renumber all markers.
    function reorderMarkers(id, requestedOrder) {
      const orderedMarkers = [...markers.values()]
        .sort((a, b) => a.order - b.order)
        .filter((item) => item.id !== id);
      const markerData = markers.get(id);
      orderedMarkers.splice(requestedOrder - 1, 0, markerData);
      orderedMarkers.forEach((item, index) => { item.order = index + 1; });
    }

    // Add a new draggable marker at the map location the user clicked.
    function selectLocation(latLng, savedName, quiet = false) {
      markerNumber += 1;
      const marker = new google.maps.Marker({
        position: latLng,
        map,
        title: savedName || `Location ${markerNumber}`,
        draggable: true
      });
      // Give the marker a default name and place it at the end of the trip.
      const markerData = {
        id: `marker-${markerNumber}`,
        name: savedName || `Location ${markerNumber}`,
        order: markers.size + 1,
        marker
      };
      markers.set(markerData.id, markerData);
      // Update coordinates and the matching list card while dragging.
      marker.addListener('drag', () => {
        updateCoordinates(marker.getPosition());
        const card = document.querySelector(`[data-marker-id="${markerData.id}"] .marker-coordinates`);
        if (card) card.textContent = formatCoordinates(marker.getPosition());
      });
      // Refresh the list and weather after the marker stops moving.
      marker.addListener('dragend', () => {
        renderMarkers();
        refreshWeather();
      });
      if (!quiet) {
        renderMarkers();
        updateCoordinates(latLng);
        refreshWeather();
      }
    }

    // Replace the weather panel with a simple status message.
    function renderWeatherMessage(message) {
      const list = document.getElementById('weather-list');
      list.replaceChildren();
      const messageElement = document.createElement('div');
      messageElement.className = 'weather-placeholder';
      messageElement.textContent = message;
      list.appendChild(messageElement);
    }

    // Request weather for one marker from the Python endpoint.
    async function fetchWeather(markerData) {
      const position = markerData.marker.getPosition();
      const response = await fetch(
        `${WEATHER_API_URL}?lat=${encodeURIComponent(position.lat())}&lon=${encodeURIComponent(position.lng())}`
      );
      if (!response.ok) throw new Error('Weather request failed.');
      return response.json();
    }

    // Fetch and redraw weather cards for every saved marker.
    async function refreshWeather() {
      const list = document.getElementById('weather-list');
      if (!markers.size) {
        renderWeatherMessage('Add a location to see its current weather.');
        return;
      }

      // Show temporary loading cards while the requests are running.
      list.replaceChildren();
      const orderedMarkers = [...markers.values()].sort((a, b) => a.order - b.order);
      orderedMarkers.forEach((markerData) => {
        const loading = document.createElement('div');
        loading.className = 'weather-placeholder';
        loading.textContent = `Loading weather for ${markerData.name}…`;
        list.appendChild(loading);
      });

      try {
        const weather = await Promise.all(orderedMarkers.map(fetchWeather));
        weather.forEach((data, index) => { orderedMarkers[index].weather = data; });
        list.replaceChildren();
        // Render the response beside the matching marker name.
        weather.forEach((data, index) => {
          const card = document.createElement('article');
          card.className = 'weather-card';
          const heading = document.createElement('h3');
          heading.textContent = orderedMarkers[index].name;
          card.appendChild(heading);
          const temperature = document.createElement('p');
          temperature.className = 'weather-temperature';
          temperature.textContent = `${data.temperature}${data.temperature_unit}`;
          card.appendChild(temperature);
          const condition = document.createElement('p');
          condition.textContent = data.condition;
          card.appendChild(condition);
          const wind = document.createElement('p');
          wind.textContent = `Feels like ${data.apparent_temperature}${data.temperature_unit} · Wind ${data.wind_speed} ${data.wind_speed_unit}`;
          card.appendChild(wind);
          if (data.humidity != null) {
            const humidity = document.createElement('p');
            humidity.textContent = `Humidity ${data.humidity}%`;
            card.appendChild(humidity);
          }
          list.appendChild(card);
        });
      } catch (error) {
        console.error('Weather error:', error);
        orderedMarkers.forEach((item) => { item.weather = null; });
        renderWeatherMessage('Weather is unavailable. Start weatherapi.py in server mode to load conditions.');
      }
    }

    // Create the Google Map and connect map clicks to marker creation.
    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        zoom: 8,
        center: { lat: 39.710092, lng: -75.119362 }
      });

      // NOTE: google.maps.KmlLayer was removed from the Maps JavaScript API (v3.66.11a),
      // and calling it throws an error that stopped the click handler below from being attached.
      map.addListener('click', (event) => selectLocation(event.latLng));
      restorePins();
    }
    // The Google Maps script calls this function after it finishes loading.
    window.initMap = initMap;

    // Load Google Maps dynamically using the key from config.js.
    (() => {
      const mapEl = document.getElementById('map');
      try {
        if (!GOOGLE_MAPS_API_KEY) throw new Error('No key');
        // Build the external script element at runtime.
        const script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GOOGLE_MAPS_API_KEY) + '&callback=initMap';
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      } catch {
        // Show a useful message instead of leaving a blank map if the key is missing.
        mapEl.textContent = 'Map unavailable: add GOOGLE_MAPS_API_KEY to config.js.';
      }
    })();

    // ---------- Saving trips ----------
    const PENDING_KEY = 'tripcastPendingTrip';

    // The current pins, in trip order, as plain data (including the weather already shown for each).
    function pinsAsData() {
      return [...markers.values()].sort((a, b) => a.order - b.order).map((item) => {
        const position = item.marker.getPosition();
        const w = item.weather;
        return {
          name: item.name,
          latitude: position.lat(),
          longitude: position.lng(),
          weather: w ? { temperature: w.temperature, condition: w.condition, humidity: w.humidity ?? null, windSpeed: w.wind_speed } : null
        };
      });
    }

    function setSaveMessage(text, isError = false) {
      const el = document.getElementById('save-msg');
      el.textContent = text;
      el.className = isError ? 'error' : '';
    }

    // Keep the pins in this browser tab so they survive a visit to the login page.
    function stashPins() {
      if (!markers.size) return;
      sessionStorage.setItem(PENDING_KEY, JSON.stringify({
        tripName: document.getElementById('trip-name').value,
        pins: pinsAsData().map(({ name, latitude, longitude }) => ({ name, latitude, longitude }))
      }));
    }

    // Put stashed pins back on the map after logging in.
    function restorePins() {
      let saved;
      try { saved = JSON.parse(sessionStorage.getItem(PENDING_KEY) || 'null'); } catch { saved = null; }
      if (!saved || !Array.isArray(saved.pins) || !saved.pins.length) return;
      sessionStorage.removeItem(PENDING_KEY);
      saved.pins.forEach((pin) => selectLocation({ lat: pin.latitude, lng: pin.longitude }, pin.name, true));
      document.getElementById('trip-name').value = saved.tripName || '';
      renderMarkers();
      refreshWeather();
      setSaveMessage('Your pins were restored. Click Save trip when you are ready.');
    }

    async function saveTrip() {
      if (!markers.size) { setSaveMessage('Add at least one pin first.', true); return; }
      const button = document.getElementById('save-trip');
      button.disabled = true;
      setSaveMessage('Saving…');
      try {
        const res = await fetch('api/trips.php?action=save', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            tripName: document.getElementById('trip-name').value.trim() || 'My trip',
            destinations: pinsAsData()
          })
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          stashPins();
          setSaveMessage('Please log in to save your trip. Taking you to the login page…', true);
          setTimeout(() => { window.location.href = 'userLogin.html'; }, 1500);
          return;
        }
        if (!res.ok) throw new Error(data.error || `Could not save the trip (HTTP ${res.status}).`);

        // Saved: clear the map and open the history page.
        markers.forEach((item) => item.marker.setMap(null));
        markers.clear();
        renderMarkers();
        renderWeatherMessage('Trip saved.');
        document.getElementById('trip-name').value = '';
        sessionStorage.removeItem(PENDING_KEY);
        setSaveMessage('Trip saved! Opening your history…');
        setTimeout(() => { window.location.href = 'history.html'; }, 1000);
      } catch (error) {
        console.error('Save trip error:', error);
        setSaveMessage(error.message || 'Could not save the trip.', true);
      } finally {
        button.disabled = false;
      }
    }
    document.getElementById('save-trip').addEventListener('click', saveTrip);

    // ---------- Use my location ----------
    function setLocateMessage(text, isError = false) {
      const el = document.getElementById('locate-msg');
      el.textContent = text;
      el.className = 'locate-msg' + (isError ? ' error' : '');
    }

    // Ask the browser for the user's position, center the map there, and drop a pin.
    function useMyLocation() {
      if (!map) { setLocateMessage('The map has not loaded yet.', true); return; }
      if (!('geolocation' in navigator)) { setLocateMessage('Your browser does not support location.', true); return; }
      const button = document.getElementById('use-location');
      button.disabled = true;
      setLocateMessage('Finding your location…');
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const latLng = new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
          map.panTo(latLng);
          map.setZoom(12);
          selectLocation(latLng, 'My location');
          setLocateMessage('Pin added at your location.');
          button.disabled = false;
        },
        (error) => {
          const reasons = {
            1: 'Location permission was denied. Allow it in your browser settings and try again.',
            2: 'Your location could not be determined.',
            3: 'Finding your location took too long. Try again.'
          };
          setLocateMessage(reasons[error.code] || 'Could not get your location.', true);
          button.disabled = false;
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
      );
    }
    document.getElementById('use-location').addEventListener('click', useMyLocation);

    // Going to Login / Create Account? Keep the pins first.
    document.querySelectorAll('a[href="userLogin.html"], a[href="signup.html"]').forEach((link) => link.addEventListener('click', stashPins));

    // Logged in: show the user's name and a Log out button. Logged out: keep Login / Create Account.
    (async () => {
      const nav = document.getElementById('account');
      try {
        const user = await getCurrentUser();
        if (user) {
          const hello = document.createElement('span');
          hello.className = 'hello';
          hello.textContent = 'Hi, ' + user.firstName;
          const logout = document.createElement('button');
          logout.type = 'button';
          logout.className = 'pill primary';
          logout.textContent = 'Log out';
          logout.onclick = async () => {
            try { await logoutUser(); } catch (error) { alert(error.message); return; }
            location.reload();
          };
          nav.replaceChildren(hello, logout);
        }
      } catch (error) {
        console.error('Could not check login state:', error);
      } finally {
        nav.style.visibility = 'visible';
      }
    })();
  </script>
</body>
</html>
