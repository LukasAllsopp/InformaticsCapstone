<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripCast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep: #0d2b36; --sea: #1f6f8b; --sky: #8fd0e0; --sun: #f2b53a; --mist: #eaf3f2; --ink: #0d2b36;
      --display: "Fraunces", Georgia, serif; --body: "Outfit", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--body); color: var(--ink); padding: 28px;
      background: radial-gradient(circle at 15% 10%, #cfe9ee 0, transparent 45%), radial-gradient(circle at 90% 90%, #f6e7c3 0, transparent 40%), var(--mist);
    }

    /* The frame from the wireframe, now a rounded card */
    .frame {
      height: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
      border-radius: 22px; background: #fff; box-shadow: 0 24px 60px -20px rgba(13,43,54,.45), 0 0 0 1px rgba(13,43,54,.08);
    }

    /* Header: History | Title | Login + Create Account */
    header {
      position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 22px 28px;
      color: #fff; background: linear-gradient(120deg, var(--deep) 0%, var(--sea) 70%, #3a9bb5 100%);
      border-bottom: 4px solid var(--sun);
    }
    /* faint contour lines for a map-like texture */
    header::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .12;
      background: repeating-radial-gradient(circle at 80% 120%, transparent 0 18px, #fff 18px 19px);
    }
    header > * { position: relative; }

    .brand { display: flex; align-items: center; gap: 12px; justify-self: center; }
    .brand svg { width: 38px; height: 38px; flex: none; }
    .brand h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 3.4vw, 2.3rem); letter-spacing: .01em; }

    .left { justify-self: start; }
    .right { justify-self: end; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

    /* Oval buttons */
    .pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border-radius: 999px; text-decoration: none;
      font-weight: 500; color: #fff; border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.12);
      backdrop-filter: blur(6px); transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .pill svg { width: 16px; height: 16px; }
    .pill:hover { transform: translateY(-2px); background: rgba(255,255,255,.25); box-shadow: 0 8px 18px -8px rgba(0,0,0,.5); }
    .pill.primary { background: var(--sun); border-color: var(--sun); color: var(--deep); font-weight: 600; }
    .pill.primary:hover { background: #ffc857; }
    .pill:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    #map { flex: 1; min-height: 300px; display: grid; place-items: center; color: #4d6a70; background: var(--mist); }

    button.pill { font: inherit; font-weight: 600; cursor: pointer; }
    .hello { align-self: center; font-weight: 500; }
    #account { visibility: hidden; } /* hidden until we know if someone is logged in, so the buttons don't flash */

    @media (prefers-reduced-motion: reduce) { .pill { transition: none; } .pill:hover { transform: none; } }
    @media (max-width: 760px) {
      body { padding: 8px; }
      .frame { border-radius: 14px; }
      header { grid-template-columns: 1fr; justify-items: center; padding: 16px; }
      .left, .right { justify-self: center; justify-content: center; }
      .brand { order: -1; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <nav class="left" aria-label="History">
        <a class="pill" href="history.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          History
        </a>
      </nav>
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="17" stroke="#fff" stroke-width="2"/><path d="M20 7l4.5 13L20 33l-4.5-13z" fill="#f2b53a"/><circle cx="20" cy="20" r="2.2" fill="#0d2b36"/></svg>
        <h1>TripCast</h1>
      </div>
      <nav class="right" id="account" aria-label="Account">
        <a class="pill" href="userLogin.html">Login</a>
        <a class="pill primary" href="signup.html">Create Account</a>
      </nav>
    </header>
    <main id="map" role="application" aria-label="Map">Loading map…</main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    function initMap() {
      const map = new google.maps.Map(document.getElementById('map'), {
        zoom: 8,
        center: { lat: 41.876, lng: -87.624 }
      });
      // Your original KML layer; the URL must be publicly reachable for Google to load it.
      new google.maps.KmlLayer({ url: 'https://www.veuzz.com/kml/examples.kml', map });
    }
    window.initMap = initMap;

    (async () => {
      const mapEl = document.getElementById('map');
      try {
        if (!GOOGLE_MAPS_API_KEY) throw new Error('No key');
        const s = document.createElement('script');
        s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GOOGLE_MAPS_API_KEY) + '&callback=initMap';
        s.async = true;
        document.head.appendChild(s);
      } catch {
        mapEl.textContent = 'Map unavailable: add GOOGLE_MAPS_API_KEY to config.js.';
      }
    })();
  </script>
  <script>
    // Logged in: show the user's name and a Log out button. Logged out: keep Login / Create Account.
    (async () => {
      const nav = document.getElementById('account');
      const user = await getCurrentUser();
      if (user) {
        const hello = document.createElement('span');
        hello.className = 'hello';
        hello.textContent = 'Hi, ' + user.firstName;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pill primary';
        btn.textContent = 'Log out';
        btn.onclick = async () => {
          try { await logoutUser(); } catch (e) { alert(e.message); return; }
          location.reload();
        };
        nav.replaceChildren(hello, btn);
      }
      nav.style.visibility = 'visible';
    })();
  </script>
</body>
</html>
